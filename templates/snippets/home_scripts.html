<script>
(function(){
  var revealObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.style.opacity='0.7';e.target.style.transform='translateY(0)';e.target.style.filter='blur(0)'}})},{threshold:0.25});document.querySelectorAll('.scroll-reveal').forEach(function(el){revealObserver.observe(el)});var flashObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible')}})},{threshold:0.5});document.querySelectorAll('.opening-flash').forEach(function(el){flashObserver.observe(el)});(function(){var figure=document.getElementById('wanderer-figure');if(!figure)return;var section=document.getElementById('wanderer-gallery');var reveals=document.querySelectorAll('#wanderer-gallery .scroll-reveal');var firstReveal=reveals[0];var hideTarget=reveals[reveals.length-4];if(!firstReveal||!hideTarget)return;var figureShown=false;var showObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting&&e.boundingClientRect.top<0&&!figureShown){figureShown=true;figure.style.opacity=(window.innerWidth<768?'0.34':'0.65');figure.style.animationPlayState='running'}})},{threshold:0});var hideObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting&&e.boundingClientRect.top<0&&figureShown){figureShown=false;figure.style.opacity='0';figure.style.animationPlayState='paused'}})},{threshold:0});var sectionObserver=new IntersectionObserver(function(entries){entries.forEach(function(e){if(!e.isIntersecting){figure.style.opacity='0';figure.style.animationPlayState='paused';figureShown=false}})},{threshold:0.02});showObserver.observe(firstReveal);hideObserver.observe(hideTarget);sectionObserver.observe(section)})();
  var t=setTimeout(function(){
    var cards=document.querySelectorAll('.ts-image-link');
    var container=document.querySelector('.ts-image-link') && document.querySelector('.ts-image-link').parentElement;
    if(!container) return;
    function clearAll(){
      cards.forEach(function(l){l.classList.remove('is-hover');l.classList.remove('is-opacity');});
    }
    container.addEventListener('mousemove',function(e){
      var ratio=e.clientX/window.innerWidth;
      if(ratio<=1/3){clearAll();return;}
      var target=e.target.closest('.ts-image-link');
      if(!target){return;}
      cards.forEach(function(l){
        if(l===target){l.classList.add('is-hover');l.classList.remove('is-opacity');}
        else{l.classList.remove('is-hover');l.classList.add('is-opacity');}
      });
    });
    container.addEventListener('mouseleave',function(){clearAll();});
  },200);
})();
</script>
<script>(function(){
var vids=document.querySelectorAll('video[autoplay]');
if(!vids.length)return;
var played=new WeakSet();
function tp(v){if(played.has(v))return;var p=v.play();if(p&&p.then){p.then(function(){played.add(v)}).catch(function(){})}}
function tpa(){vids.forEach(tp)}
tpa();
function og(){tpa();document.removeEventListener('click',og);document.removeEventListener('touchstart',og)}
document.addEventListener('click',og);document.addEventListener('touchstart',og);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tpa()});
if('IntersectionObserver' in window){
var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)tp(e.target)})},{threshold:0.1});
setTimeout(function(){vids.forEach(function(v){if(v.paused&&!v.ended)ob.observe(v)})},2000)}
})();</script>
