  title: CardioAgent · ISAIMS 2025
- type: text
  tag: Unfold
  paragraphs:
  - 心血管疾病诊疗的痛点很明确：现有 AI 大多是孤立的黑箱模型——能吐一个预测分数，却说不出为什么。更麻烦的是，心电图、医学影像、临床指南这些多模态信号各说各话，没有一个框架把它们揉在一起。CardioAgent
    想做的，就是搭一个多智能体协作框架——每个 Agent 管一摊，把多模态信号嚼碎了再拼起来，给出可解释、能落地的决策支持。
  - 技术路线上，多智能体分工协作是骨架，一维时序数据增强让 ECG 信号更鲁棒，FAISS 向量索引搭起 RAG 闭环——让每条建议都挂得上指南证据。我的角色是共同作者，扛了一维时序增强策略、多模态融合机制和
    FAISS 向量索引 RAG 闭环三块——把「黑箱预测」往「可解释决策」推了一把。
