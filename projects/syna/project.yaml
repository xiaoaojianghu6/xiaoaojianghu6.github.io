- type: text
  tag: Echoes · 以生活细节识人的共鸣引擎
  paragraphs:
  - 社交匹配不靠脸。Echoes 的匹配依据是可核对的生活事实：同一天去过的地点、相同的情绪、共同的标签——「你们都提到了
  - 匹配不是选美，也不做第二个微信——破冰之后的聊天刻意做得轻，仅限于围绕彼此分享的生活片段展开。
- type: video
  portrait: true
  src: /projects/syna/media/echoes-demo.mp4
