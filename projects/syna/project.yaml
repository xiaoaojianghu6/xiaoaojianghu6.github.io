- type: text
  tag: 边界与底线
  paragraphs:
  - 明确不做的事：不做即时通讯、不做自动发布、不做颜值滑卡、不做通用知识问答。产品的每一条边界都指向同一个原则——记录属于用户自己。
  - 隐私优先：默认全部私密，原始媒体本地保存并定期清理，只留存摘要与标签；细节回溯只基于本人记录检索作答，检索不到就明确说找不到——答案必须附证据，这是产品的底线。
