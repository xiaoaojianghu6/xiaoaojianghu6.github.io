overview:
- 戴上眼镜过生活，摘下手机看故事。Syna 是一款基于 AI 智能眼镜的生活日志 + 社交产品：眼镜替你无感记录，AI 替你整理与回想，然后让走过相似一天的人自然相遇。它想服务的是一类「半记录者」——拍了但从不整理，想表达但不知从何说起。
- 我独立完成产品定义与安卓端开发（基于 Rokid 乐奇开发者 SDK）：从用户画像、功能边界、交互设计，到眼镜端—手机端数据流与 AI 处理链路。项目已开源：github.com/hsrxr/Syna。
sections:
- type: text
  tag: 产品定义
  paragraphs:
  - 记录的门槛不该是「掏出手机、打开 App、想好配文」。Syna 把采集交给眼镜：单击镜腿拍照，双击说一句速记、说完自动停，长按直接和 AI 对话——记录成为生活的背景，而不是一项任务。
  - AI 负责把碎片编织成可带走的东西：每天一段有叙事的总结（关键词、情绪、高光），想不起来的细节可以问回去——「我钥匙放哪了？」「上周三下午我在做什么？」答案附带当时的画面与语音证据。AI 出草稿，你定稿。
