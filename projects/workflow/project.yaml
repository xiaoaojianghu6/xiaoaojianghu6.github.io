  paragraphs:
  - LLM 单独用是玩具，知识陈旧还会「胡说八道」。串进工作流、挂上外部工具和知识库，才变成靠谱的生产力。我用 Dify + Docker 在本地搭了一套 AI Agent 实践场：基础 RAG 配医学指南知识库，知识检索节点加
    Prompt 约束专家角色；Text-to-SQL 用自然语言查 PostgreSQL，Antv/Echarts 自动出图；MCP 高德工具调用，再把工作流本身发布为 MCP Server；高阶
    RAG 调 PubMed 拉文献。
  - 全部 Docker 本地部署，一套可复现的 Dify 工作流范式：RAG 让 Agent 回答有据可依，Text-to-SQL 把数据库变成聊天对象，MCP 让工作流反向成为可被调用的工具。边学边搭，每个节点都自己踩过坑验证过，沉淀成可复用的学习笔记。
