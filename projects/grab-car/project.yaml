- 机械与控制的入门课设——从一张白纸到一辆会自己抓东西的小车。这是我第一次把课本上的运动学和电路图，变成能在地上跑、能听我遥控的铁疙瘩。
- 从 SolidWorks 画第一根轴开始，到 PS2 手柄遥控整车联调结束——走完了一个完整硬件项目的每一道工序。
