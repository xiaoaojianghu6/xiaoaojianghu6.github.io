overview:
- SAM，全称 Segment Anything Model——Meta 搞出来的「万物皆可分割」模型。给它一张图，点一个位置，它就能把那个「东西」的轮廓完整地框出来。但我关心的不是「万物」，是「这一个」——在一段连续视频流里，持续追踪我指定的那个人，不是别人，不是路边的牛或马，是我框出来的
  Tim哥。这个就是实例分割。
