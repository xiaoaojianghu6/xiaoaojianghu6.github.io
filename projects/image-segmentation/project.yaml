- type: text
  tag: 缺陷定位与改进
  paragraphs:
  - 复现不是终点，找问题才是。我设计了一组 first_frame 约束基线实验——只用第一帧的标注信息做全视频推理，得到 J&F 80.15%。与完整方法的差距分析定位出两类独立缺陷：早期误识别（模型在第一帧之后的扩散过程中逐渐漂移）和
    CLIP 语义混淆（CSTMamba 引入的 CLIP 文本先验过强，导致器械被映射到错误的语义类别）。
  - 在此基础上，我实现了完整的 PEFT 微调方案：CLIP 高层解冻（释放语义编码器的适应性），object_score 损失加权（加大误分类样本的惩罚），以及 SAM3 风格的 Existence
    Token（让模型学会「这个目标是否还在画面中」）。首次微调因多变量耦合导致性能不升反降——这恰好验证了缺陷定位的准确性：三个改进维度必须独立调优。目前正在搭建基于 DDP 的多卡分布式训练，设计覆盖学习率、解冻层数、损失权重等维度的
    Grid Search 消融实验，系统验证各组件的收敛特征。
