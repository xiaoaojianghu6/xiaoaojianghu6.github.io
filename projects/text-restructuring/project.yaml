overview:
- 写长文的人都有这种焦虑：结构乱没乱？前面说的话和后面矛盾了吗？宕开一笔的伏笔捡回来没有？市面上的工具要么让你手动搭知识图谱，要么 AI 丢给你一个「摘要」——可我要的不是摘要，是全量保留、逐句理清。
- 于是我自己造了一个轮子：六套语言学理论撑起一条全自动结构化管线。它不概括、不缩写、不替你写——它只做一件事：读你的全部文档，告诉你哪里有问题。
