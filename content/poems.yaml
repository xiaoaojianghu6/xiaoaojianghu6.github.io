poems:
  houru:
    title: 候鸟的诗
    date: ''
    lines: 野花的浪起伏\n野草的背弯弯\n软乎软乎的小云\n咬一口淡淡的远山\n候鸟的人\n只敢远远地看\n\n看她修长的小腿\n挠着寂寞的沙洲\n晚风绵绵。\n看她细滑的长颈\n她灵光的小脑袋\n张望，流连。\n看她优雅的弧度\n银白色的翅羽\n划过静默的湖面。\n像轻柔的指尖\n撩动波浪的琴弦。\n\n滑翔，侧翻，俯冲，振翅\n溅起羽花\n溅起游动的落日\n\n等候，静候，问候，守候\n候鸟的人爱着候鸟\n候鸟却不曾停留\n\n她是湖水的女儿\n蓝天的初恋\n她属于绿林\n她属于夕烟\n她是属于自由的诗歌\n她是不属于人类的语言\n\n我感到\n我的记忆在闪光\n身体在融化\n我将在这一刻\n完全全地，属于纯洁的她\n\n别再问我\n诗歌降临的感觉\n我又不是诗人\n\n我就是诗\n候鸟的诗
    excerpt: 野花的浪起伏，野草的背弯弯
  qingchen:
    title: 清晨，独行在师大南区的小路
    date: ''
    lines: 清晨，\n独行在南区的小路\n灰色的泥墙，倚靠着蓊郁的大树\n清风徐来，\n渐晕的朝阳，轻快的脚步\n缭动的发丝，\n是镶着金边的爬山虎。\n燕儿，破着风飞翔\n雀儿，舞动着银色的翅膀\n云儿，随着蓝天的旋律，自在飘荡\n我的船儿，要去向何方？\n坚定，迷茫的双桨。\n时拿时放。\n啊，且让我追逐着明天的脚步吧！\n我要画下月光，\n走向太阳
    excerpt: 灰色的泥墙，倚靠着蓊郁的大树
  ruju:
    title: 入局
    date: ''
    lines: 江山大浪没城村，\n湖岸微风问行人。\n晴空天下暗波涌，\n潜湖循江万树深。
    excerpt: 晴空天下暗波涌，潜湖循江万树深
  xuefuan:
    title: 雪伏案
    date: 2022.12.9
    lines: 乾坤穿白絮\n山河挂雪袍\n簌簌檐下过\n漫漫宇上飘\n梦醒终辛苦\n霜风欺年少\n挑灯按纸笔\n起坐意难消
    excerpt: 乾坤穿白絮，山河挂雪袍
  xueqing:
    title: 雪晴
    date: 2024.01.23
    lines: 开户波光暖\n初阳照雪晴\n登攀趋日近\n垂望九川平
    excerpt: 开户波光暖，初阳照雪晴
  heise:
    title: 黑色静穆
    date: ''
    lines: 大树中了毒。\n夜雨送检，\n冬风是一把解剖刀。\n鲜血淋漓，尊严挺立，依然。\n年轮溶解着冷漠，\n混乱裹挟无声的寒战。\n那枯枝恐怕是天空的纹理，\n落叶，不过是大地的尸斑。
    excerpt: 大树中了毒。夜雨送检，冬风是一把解剖刀。
  wuti:
    title: 无题
    date: ''
    lines: 最是年少喜张扬，\n敢说敢做敢担当。\n抛却苦恼伤心事，\n风满和弦日满窗。
    excerpt: 最是年少喜张扬
  dengemei:
    title: 登峨眉
    date: 2023.08.14
    lines: 风清日朗更疏云，\n叶隐万树兵。\n人群跃动，烟香雾横，\n佳阁好清音。\n循山而上雷洞坪，攀金顶。\n我独不语，群山回唱，\n芸生簇簇万象新。\n长风渐著，白日微曛。\n峨眉山岳却森森。\n人生百年长寂寞，\n且向青冥问一樽。\n山前仍作冷风吹。
    excerpt: 长风渐著，白日微曛。峨眉山岳却森森。
  yetu:
    title: 夜徒
    date: 2023.11.03
    lines: 飘茫秋雨漫江城\n江滩渔船夜点灯\n循桥巡江寻粮道\n荧光夜徒到五更
    excerpt: 飘茫秋雨漫江城，江滩渔船夜点灯
  xifeng:
    title: 西风
    date: ''
    lines: 洪城日暮意迟迟\n裁罢难题更裁诗\n苍鹰怒马西风烈\n还待杏花春雨时
    excerpt: 洪城日暮意迟迟，裁罢难题更裁诗
  shizhi1:
    title: 失志其一
    date: ''
    lines: 当年万里觅封侯，剑气指九州\n可怜长城空自许，又值寒秋\n便看满园千芳紫，独我不可登高楼\n肠断处，水悠悠
    excerpt: 当年万里觅封侯
  shizhi2:
    title: 失志其二
    date: ''
    lines: 落暮霜林晚\n秋风马蹄疾\n危危天不改\n蓼蓼故人稀
    excerpt: 落暮霜林晚，秋风马蹄疾
  zhiqige:
    title: 志气歌·中秋夜
    date: ''
    lines: 暗叶幽枝拨紫夜\n清辉影里玉轮翻\n今学嫦娥守寂寞\n明年折挂赠仙官
    excerpt: 暗叶幽枝拨紫夜，清辉影里玉轮翻
  chayanyuese:
    title: 出辛亥革命博物馆初饮茶颜悦色题
    date: 2023.12.10
    lines: 看罢博展暗出神，首义旗下闻枪声。\n秋山秋雨隐秋日，江岸江花弄江城。\n烟云沉沉生饥渴，寒意萧萧人微困。\n店门忽现妆红色，四五兄弟茶几樽。\n桃花坞口擎奶盖，绵香稠腻细勾魂。\n冰白浅粉吐春色，滑舌入腹质地温。\n“疏影横斜水清浅，暗香浮动月黄昏。”\n水墨茶颜杯悦色，远黛如泼意境深。\n茶尽犹余长回味，清气半吐古韵成。
    excerpt: 看罢博展暗出神，首义旗下闻枪声
  povillage:
    title: 当洪水淹没我的家乡
    date: ''
    lines: 是什么地方又唱起饶河调？\n航拍下的鄱阳\n熟悉的旋律，\n漾出无名的悲伤\n\n安徽的暴雨，\n鄱阳决口的圩堤\n\n洪水与黑夜\n城镇与渔庄\n在每一座圩堤上\n在每一座大坝上\n一群群乡村干部\n一队队人民战士\n是湖水还是汗水？\n浸湿你的衣裳\n\n我的湖城，我的鄱阳\n一个刚刚脱贫的小城\n是我的家乡\n\n你是我最深的情节\n是我心灵最深的地方\n你给我所有的甜\n又给我莫名的痛\n是父亲的微笑，爷爷的胡茬，奶奶的白发，\n而今，我又看见你的面孔\n泥泞的脸上写满的坚毅与不屈\n加油，鄱阳\n我愿给予你所有的祝福\n所有的盼望\n\n我看见，我看见，\n不远的地方闪动的黎明，\n我看见洪水的尽头，种着太阳，\n我看见百灵鸟，歌唱的百灵鸟，\n看见阳光\n洒进老城的街道
    excerpt: 我的湖城，我的鄱阳，一个刚刚脱贫的小城，是我的家乡
  daoyuanye:
    title: 悼念袁爷爷
    date: ''
    lines: 一心为民去饥荒\n八旬下地务农忙\n裤跟鞋底泥土沃\n衣衫两袖稻花香\n千里澄澄功犹在\n万国默默齐哀伤\n吾辈继志勤勉励\n禾稻底下可乘凉
    excerpt: 千里澄澄功犹在，万国默默齐哀伤
  jihenan:
    title: 寄河南
    date: ''
    lines: 君不见\n天神触怒拨风雨，洪波漫漫阔如潮\n君不见\n冰箱彩电无处落，人车浮沉水中飘\n\n分崩离散知多少，暴雨烈烈沙阻道\n淹没店商三千所，横扫街巷一万条\n交通瘫痪步难行，焦目无神盼归家\n浪钩颈颔心慌乱，紧抱长杆手已麻\n信号阻隔无音讯，烛火亲人遥牵挂\n\n艰难里，人民英雄见伟大\n英雄人民在一起，咱不怕！\n\n警政工医终职守，军民志愿救死生\n兢兢业业水中岗，寻寻觅觅死亡线\n风雨兄弟手相牵，华夏同胞心相连\n四方聚靠传物资，七石汇聚补苍天\n\n河南莫怕风雨难，九州齐力助援舟！
    excerpt: 君不见，天神触怒拨风雨，洪波漫漫阔如潮
  kuanggexing:
    title: 狂歌行
    date: ''
    lines: 年少最是轻狂，\n日月心间挥日月，言笑自带岭南香\n翻书笑骂孔夫子，摇手自是探花郎\n吟啸徐行穿风雨，阴晴又何妨？\n只是，将四月研学，把五月歌唱\n却恨时不久，日不长\n惊醒里，末了，终了\n不晓得刷了几册习题，做得几段文章\n只得六月匆忙，临阵磨刀枪\n\n高一直是尽了，尽了的吧！\n回甘四季锦，梦里徜徉\n还可取将低吟浅唱。\n只是青年，切莫，切莫\n将习题搁放，将文章抛忘\n切莫负了，这金玉似的，\n飞矢般的，青华流光
    excerpt: 年少最是轻狂，日月心间挥日月，言笑自带岭南香
long_poem:
  title: 我的大学是一片云
  stanzas:
  - 秋雨。疲惫在寒风中战栗。<br>我用冷水冲刷我滚烫的脸颊，<br>在枯燥的，肃穆的，入冬下午，<br>思索，回忆。
  - 人说，这日子什么时候是个头呢？<br>对呀，什么时候是个头呢？<br>窗边，我请长风穿透我的身体——
  - 心跳呢喃，句点跃动，<br>长风细语。
  - 是，这令人头疼的大学生活，<br>可我又何时不曾热爱。<br>何时不曾越过乏味，越过伤痛，<br>勇敢地拥抱你，做自己。
  - 我攀过绝壁，溯过深溪<br>在高原望雪，在阳光下写诗<br>我坚持思考，坚持读书，<br>在无人秘处，随着音乐疯狂起舞
  - 我在林间漫步，<br>听孤独伞叶上酥酥的小雨<br>我在公园路旁的双人椅上打盹，<br>舔慵懒蓝天下柔软的微风
  - 我在合唱团抚摸音符的流动<br>我在实验室初窥能量魔法<br>我去商业街浸泡人间烟火<br>我在山中静默，飘然如仙
  - 我关心世界政治风云激荡<br>我瞻望科技洪流滚滚向前<br>我学习3D建模，制作零件<br>我设计和制作电路板，编程操作数控机床<br>我同样劳动——<br>浇筑铝块，去焊接，去锯切
  - 我让小车奔驰，让激光作画<br>我学习大语言模型，图像分割，为科技的前沿兴奋
  - 我去了解生化，研究机理，<br>为生命的奥妙惊奇
  - 我狂热地寻找美食<br>我在濛濛雨天点一份诱人的外卖<br>我在图书馆奖励自己一杯温热的咖啡
  - 我在午夜<br>啃烧鸡，看柯南，喝橙汁，
  - 我在破晓，<br>带着便当去看云烧透整个麻木的城市
  - 我骑自行车，去很远的地方看花海<br>我游泳，游它几十个来回消解胸中苦闷<br>我参加乒乓球比赛，享受赛场上风姿飒飒<br>我长跑，健身，体验胸腔爆炸和酣畅淋漓
  - 我一个人去放映厅享受视听震撼<br>我亦架小船在湖心漂流<br>我和三两老友，<br>抓娃娃，打台球，<br>在远离家乡的街头夜晚，再弄几瓶啤酒
  - 我独自刷夜，<br>抬头搜寻那宏大深邃的夜幕下<br>有没有坚定勇敢的孤星
  - 确实，我一直在寻找自己，<br>自己却飘忽不定<br>在大学，<br>总是茫然，总是怀疑，<br>总想逃避，总想放弃，
  - 但我想说，我会一直淡泊从容坚定地走
  - 就像我热爱的云，<br>它一直飘在人间和宇宙之间，<br>尽管，有时，它会透过阳光，<br>有时它会哭泣。
  - 风说：<br>我，我的大学生活，都像云，<br>一片纯洁的云，<br>一片彩色的云，<br>一片热烈的云，<br>一片漂泊的云，<br>一片特立独行的云。
