  date: 2024.04.18
  lines:
  - 天下风云才激荡
  - 百家先手已称雄
  - 割席断义抛旧己
  - 人向西天马向东
  - 大漠寂寥谁敢闯
  - 万里秋寒送长风
  - 会当箭定天山北
  - 春山觐遇水朝宗
