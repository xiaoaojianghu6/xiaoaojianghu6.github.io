  - src: /top/enthusiast/food-yakitori.jpg
    alt: 日式烧鸟
sport:
  text: 运动对我来说是重置键。一口气游几十个来回，出来之后脑子里什么杂念都没了。变强是一件很物理的事，比很多事情都确定。
  cards:
  - title: TABLE TENNIS
    text: 上饶市青少年锦标赛单打第3 · 双打第7。从小学打到大学，赛场上的风姿飒飒是最快乐的时刻之一。
    dashed: false
  - title: SWIM
    text: 一口气游几十个来回，所有的苦闷都消散在水里。游泳是我的清场方式。
    dashed: false
  - title: FITNESS
    text: 日常健身，享受胸腔爆炸和酣畅淋漓的感觉。变强是一件很物理的事，比很多事情都确定。
    dashed: false
  - title: HIKING
    text: 武功山重装 · 扎尕那重装 · 五台山大顺朝 · 恩施溯溪 · 武汉夜徒。详见行者区。
    dashed: false
  - title: SKATEBOARD
    text: 正在学。如果有板友路过欢迎带带。
    dashed: true
  - title: SANDA
    text: 想学。强身健体，防身自卫。
    dashed: true
