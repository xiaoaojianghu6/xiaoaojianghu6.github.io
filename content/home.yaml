wanderer_quotes:
- text: 于是余有叹焉。
  last: false
- text: 古人之观于天地、山川、草木、虫鱼、鸟兽，<br>往往有得，以其求思之深而无不在也。
  last: false
- text: 夫夷以近，则游者众；<br>险以远，则至者少。
  last: false
- text: 而世之奇伟、瑰怪，非常之观，<br>常在于险远，而人之所罕至焉，<br>故非有志者不能至也。
  last: false
- text: 有志矣，不随以止也，<br>然力不足者，亦不能至也。
  last: false
- text: 有志与力，而又不随以怠，<br>至于幽暗昏惑而无物以相之，<br>亦不能至也。
  last: false
- text: 然力足以至焉，于人为可讥，<br>而在己为有悔；
  last: false
- text: 尽吾志也而不能至者，可以无悔矣，<br>其孰能讥之乎？<br>此余之所得也！
  last: true
poet_gallery:
  label: 开篇诗
  title: 背水
  date: 2024.04.18
  lines:
  - 天下风云才激荡
  - 百家先手已称雄
  - 割席断义抛旧己
  - 人向西天马向东
  - 大漠寂寥谁敢闯
  - 万里秋寒送长风
  - 会当箭定天山北
  - 春山觐遇水朝宗
