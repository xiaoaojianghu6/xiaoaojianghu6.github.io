bio_zh: 我是HAO-Z，是一名热衷探索新知的大学生，聚焦AI科技前沿，热衷于独立的创造。本科就读于华中科技大学Biomedical&nbsp;Engineering，专业研究方向集中于CV与多模态；此外也在疯狂探索AI，早期是狂热的vibe练习生，目前是Claude
  Code的重度使用患者；我关注人(Med)，人与自然，人与健康；我爱哲学，自我剖析；我爱写诗，爱一个人沉思，一个人漫步；我热衷视与听，热爱电影与摄影；我常与纯音乐伴，古典流行摇滚来者不拒；我酷爱乒乓，我还是一个老吃家。行于山川，热爱无止，热烈无限。
bio_en: Biomedical Engineering at HUST, immersed in computer vision and multimodal AI. A former vibe-coding
  enthusiast, now deep in the trenches with Claude Code. I write poetry, wander alone, live through cinema
  and photography, and find rhythm in music from Bach to Radiohead. Table tennis. Good food. Endless mountains.
  Boundless curiosity.
